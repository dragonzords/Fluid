name: Extract Fluid.zip to Root

on:
  push:
    paths:
      - 'Fluid.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Extract Fluid.zip to root
        run: |
          unzip -o Fluid.zip -d ./
          rm Fluid.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Extract Fluid.zip contents to root"
          git push
